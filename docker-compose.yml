# Artwork Finder. Put this file in an empty folder and run:
#
#   docker compose up -d
#
# then open http://localhost:4321 and add your API keys under the gear icon (Settings).
# Update later with:  docker compose pull && docker compose up -d
#
# (In a copy of the code, docker-compose.override.yml is picked up automatically and builds the
# image from that code instead: docker compose up -d --build)
services:
  artworkfinder:
    image: ghcr.io/majorgiant/artworkfinder:latest
    container_name: artworkfinder
    ports:
      # Left number = the port you open in your browser. For another port, e.g. 8080,
      # make it "8080:4321" and open http://localhost:8080.
      - "4321:4321"
    volumes:
      # Your API keys, settings, history and caches. Keep this folder private.
      - ./data:/data
    # Only needed on a NAS that expects other user IDs (Unraid: 99 and 100). Remove the # signs:
    # environment:
    #   PUID: 99
    #   PGID: 100
    restart: unless-stopped
